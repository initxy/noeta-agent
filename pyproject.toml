[project]
name = "noeta-agent"
version = "0.6.0"
description = "Noeta's official product: a single-user, local-first agent workbench."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "initxy" }]
keywords = ["agent", "llm", "workbench", "event-sourcing", "fastapi", "noeta"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    # agent-sandbox: the official AIO Sandbox client, the wire behind the SDK
    # adapters (sdk_sandbox_exec_env / sdk_browser_backend). 0.0.x is pre-1.0
    # with an unstable wire, so the upper bound is pinned.
    "agent-sandbox>=0.0.30,<0.1.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "noeta-sdk>=0.6.4",
    "noeta-runtime>=0.6.4",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[project.urls]
Homepage = "https://github.com/initxy/noeta-agent"
Repository = "https://github.com/initxy/noeta-agent"
Issues = "https://github.com/initxy/noeta-agent/issues"
Changelog = "https://github.com/initxy/noeta-agent/blob/main/CHANGELOG.md"
"Noeta runtime + SDK" = "https://github.com/initxy/noeta"

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# PEP 420 namespace layout: `noeta/` and `noeta/agent/` have no __init__.py —
# noeta-runtime publishes the `noeta.agent` identity layer (spec/registry) and
# this dist publishes the product modules into the same namespace.
[tool.hatch.build.targets.wheel]
packages = ["noeta"]

# Bundle the built SPA into the wheel at noeta/agent/static so an installed
# ``python -m noeta.agent`` serves the frontend out of the box
# (main._frontend_dist checks static/index.html first, then the repo-checkout
# web/dist). Vite dist/ is a build artifact: build web/ before packaging —
# which is why this dist is wheel-only (an sdist cannot reach web/dist; see
# docs/releasing.md).
[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "noeta/agent/static"

# Import-linter: the product reaches the runtime only through its public
# surface. Every noeta.agent.* import must land on noeta.sdk / noeta.presets (or
# the app's own noeta.agent namespace); the runtime-internal packages are
# forbidden. The two sandbox-adapter modules — `noeta.agent.host`'s
# `sdk_sandbox_exec_env` and `sdk_browser_backend` — are the sole ADR-documented
# exemptions, because they extend the concrete AIO adapters that the SDK keeps
# off its public surface (execution-environment-seam, in the library's ADRs).
# An exemption naming a module that is absent is a hard error here, not a
# warning — which is the behavior that catches a stale or misspelled exemption.
# So each one is declared in the same change that adds its adapter, never ahead
# of it, and the list may only ever shrink.
#
# The forbidden list tracks the 0.5.x layout: the microkernel refactor moved the
# builtin plugins (fs / browser / sandbox / providers / memory / …) under
# `noeta.builtins`, which the SDK dist ships but does NOT re-export — so it is
# an internal, and the concrete AIO adapters now live at
# `noeta.builtins.sandbox.impl.*`. `noeta.providers` and `noeta.guards` no
# longer exist as top-level packages and are gone from the list.
[tool.importlinter]
root_package = "noeta"

[[tool.importlinter.contracts]]
name = "noeta.agent imports only the public SDK surface"
type = "forbidden"
# Only DIRECT app→internal imports are forbidden. Reaching an internal
# transitively through noeta.sdk is exactly the intended path (the SDK facade
# legitimately imports the runtime internals it wraps).
allow_indirect_imports = "true"
source_modules = ["noeta.agent"]
ignore_imports = [
    "noeta.agent.host.sdk_sandbox_exec_env -> noeta.builtins.sandbox.impl.exec_env",
    "noeta.agent.host.sdk_browser_backend -> noeta.builtins.sandbox.impl.browser",
]
forbidden_modules = [
    "noeta.builtins",
    "noeta.client",
    "noeta.context",
    "noeta.core",
    "noeta.execution",
    "noeta.observers",
    "noeta.policies",
    "noeta.protocols",
    "noeta.read_models",
    "noeta.runtime",
    "noeta.storage",
    "noeta.testing",
    "noeta.tools",
]
